name: PokerNight
options:
  bundleIdPrefix: com.pokernight.app
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
targets:
  PokerNight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PokerNight
    info:
      properties:
        CFBundleDisplayName: Poker Night
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: PokerNight/PokerNight.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.pokernight.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.pokernight.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokernight.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: PokerNightWidgetExtension
        embed: true
      - target: PokerNightWatch
        embed: true

  PokerNightWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PokerNightWidget
      - path: PokerNight/Models
      - path: PokerNight/Support/SharedModelContainer.swift
      - path: PokerNight/Support/AppTheme.swift
      - path: PokerNight/Support/CurrencyFormatter.swift
    info:
      properties:
        CFBundleDisplayName: Poker Night Leaderboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PokerNightWidget/PokerNightWidget.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.pokernight.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.pokernight.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokernight.app.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  PokerNightWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PokerNightWatch
      - path: PokerNight/Models
      - path: PokerNight/Support/SharedModelContainer.swift
      - path: PokerNight/Support/AppTheme.swift
      - path: PokerNight/Support/DesignSystem.swift
      - path: PokerNight/Support/CurrencyFormatter.swift
    info:
      properties:
        CFBundleDisplayName: Poker Night
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pokernight.app
    entitlements:
      path: PokerNightWatch/PokerNightWatch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.pokernight.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.pokernight.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokernight.app.watchkitapp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
