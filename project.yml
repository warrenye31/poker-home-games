name: PokerNight
options:
  bundleIdPrefix: com.waylabsinc.pokernight
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  PokerNight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PokerNight
    info:
      path: PokerNight/Info.plist
      properties:
        CFBundleDisplayName: Poker Night
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: PokerNight/PokerNight.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.waylabsinc.pokernight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waylabsinc.pokernight
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PSZ849HC33
    dependencies:
      - package: Supabase
        product: Supabase
