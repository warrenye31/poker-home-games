name: PokerNight
options:
  bundleIdPrefix: com.pokernight.app
  deploymentTarget:
    iOS: "17.0"
targets:
  PokerNight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PokerNight
    info:
      properties:
        CFBundleDisplayName: Poker Night
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: PokerNight/PokerNight.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.pokernight.app
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokernight.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
