name: PokerNight
options:
  bundleIdPrefix: com.waylabsinc.pokernight
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  PokerNight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PokerNight
    info:
      path: PokerNight/Info.plist
      properties:
        CFBundleDisplayName: Poker Night
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: PokerNight/PokerNight.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.waylabsinc.pokernight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waylabsinc.pokernight
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: PokerNightWidgetExtension
        embed: true
      - package: Supabase
        product: Supabase

  PokerNightWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PokerNightWidget
      - path: PokerNight/Models
      - path: PokerNight/Support/SharedModelContainer.swift
      - path: PokerNight/Support/AppTheme.swift
      - path: PokerNight/Support/CurrencyFormatter.swift
      - path: PokerNight/Support/CurrencySettings.swift
    info:
      path: PokerNightWidget/Info.plist
      properties:
        CFBundleDisplayName: Poker Night Leaderboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PokerNightWidget/PokerNightWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.waylabsinc.pokernight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waylabsinc.pokernight.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
